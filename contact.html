<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub — Contact Us</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
.content{max-width:760px;margin:0 auto;padding:48px 24px;flex:1}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:36px}
@media(max-width:520px){.contact-grid{grid-template-columns:1fr}}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:26px;text-align:center}
.contact-card i{font-size:28px;color:var(--accent2);margin-bottom:12px;display:block}
.contact-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.contact-card p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:6px}
.contact-card a{color:var(--accent2);text-decoration:none;font-size:14px;font-weight:500}
.contact-card a:hover{text-decoration:underline}
.contact-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.contact-form h2{font-size:19px;font-weight:600;margin-bottom:20px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row-2{grid-template-columns:1fr}}
.form-group{margin-bottom:14px}
</style>
</head>
<body>
<header class="topnav" id="main-nav" data-page="contact"></header>
<div class="hero-sm">
  <h1>Contact Us</h1>
  <p>We'd love to hear from you</p>
</div>
<div style="max-width:760px;margin:0 auto;padding:8px 24px 0">
  <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>
<div class="content">
  <div class="contact-grid">
    <div class="contact-card">
      <i class="fa-solid fa-envelope"></i>
      <h3>Email Us</h3>
      <p>For any questions or issues</p>
      <a href="mailto:linkcreatorapp@gmail.com">linkcreatorapp@gmail.com</a>
    </div>
    <div class="contact-card">
      <i class="fa-solid fa-clock"></i>
      <h3>Response Time</h3>
      <p>We usually reply within</p>
      <span style="color:var(--accent2);font-weight:600">24–48 hours</span>
    </div>
  </div>
  <div class="contact-form">
    <h2><i class="fa-solid fa-paper-plane" style="color:var(--accent2);margin-right:8px"></i> Send a Message</h2>
    <div id="form-alert" class="alert"></div>
    <div class="form-row-2">
      <div class="form-group"><label>Name</label><input type="text" id="c-name" class="input" placeholder="Your name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="c-email" class="input" placeholder="you@example.com"></div>
    </div>
    <div class="form-group"><label>Subject</label><input type="text" id="c-subject" class="input" placeholder="What's this about?"></div>
    <div class="form-group"><label>Message</label><textarea id="c-message" class="input" rows="5" placeholder="Write your message here..."></textarea></div>
    <button class="btn btn-primary" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
  </div>
</div>
<footer class="site-footer" id="main-footer"></footer>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script>
async function sendMessage(){
  const name=document.getElementById('c-name').value.trim();
  const email=document.getElementById('c-email').value.trim();
  const subject=document.getElementById('c-subject').value.trim();
  const message=document.getElementById('c-message').value.trim();
  const alert=document.getElementById('form-alert');
  if(!name||!email||!subject||!message){alert.className='alert alert-error';alert.textContent='Please fill in all fields';alert.style.display='block';return;}
  try{
    await db.collection('messages').add({name,email,subject,message,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false});
    alert.className='alert alert-success';alert.textContent='✅ Message sent! We\'ll get back to you soon.';alert.style.display='block';
    ['c-name','c-email','c-subject','c-message'].forEach(id=>document.getElementById(id).value='');
  }catch{alert.className='alert alert-error';alert.textContent='Something went wrong — please try again';alert.style.display='block';}
}
</script>
</body>
</html>
