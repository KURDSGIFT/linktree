<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub — Sign In</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.blob1{width:400px;height:400px;background:rgba(99,102,241,.15);top:-100px;right:-100px}
.blob2{width:300px;height:300px;background:rgba(139,92,246,.12);bottom:-80px;left:-80px}
.auth-box{width:100%;max-width:420px;position:relative;z-index:1}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo a{font-size:26px;font-weight:700;color:var(--accent2);text-decoration:none}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:22px}
.tab-btn{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 15px var(--accent-glow)}
.form-panel{display:none}
.form-panel.active{display:block}
.form-group{margin-bottom:15px}
.username-wrap{position:relative}
.username-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.username-input{padding-left:90px!important}
.avail-check{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px}
.helper{font-size:12px;color:var(--muted);margin-top:4px}
.agree-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.agree-row input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
.agree-row label{font-size:12px;color:var(--muted);margin:0;cursor:pointer;line-height:1.5}
.agree-row a{color:var(--accent2)}
.back-link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}
.back-link:hover{color:var(--text)}
/* verify panel */
.verify-box{text-align:center;padding:8px 0}
.verify-icon{font-size:52px;margin-bottom:16px}
.verify-box h3{font-size:19px;font-weight:700;margin-bottom:8px}
.verify-box p{color:var(--muted);font-size:13px;line-height:1.65;margin-bottom:6px}
.verify-email{color:var(--accent2);font-weight:600}
.resend-btn{background:none;border:none;color:var(--accent2);font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;margin-top:6px}
.resend-btn:disabled{color:var(--muted);text-decoration:none;cursor:not-allowed}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div id="toast"></div>

<div class="auth-box">
  <div class="auth-logo">
    <a href="index.html">⚡ LinkHub</a>
    <p>Create your link page in minutes</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="alert" class="alert alert-error"></div>

    <!-- LOGIN -->
    <div class="form-panel active" id="panel-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" class="input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" class="input" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-full" onclick="loginEmail()" id="btn-login">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
      <div class="divider" style="margin:18px 0"><span>or</span></div>
      <button class="btn btn-google" onclick="loginGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP -->
    <div class="form-panel" id="panel-signup">
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="su-name" class="input" placeholder="Alex Johnson">
      </div>
      <div class="form-group">
        <label>Username (your link)</label>
        <div class="username-wrap">
          <span class="username-prefix">linkhub/</span>
          <input type="text" id="su-username" class="input username-input" placeholder="alexj" oninput="checkUsername(this.value)">
          <span class="avail-check" id="avail-icon"></span>
        </div>
        <div class="helper" id="avail-msg">Letters, numbers and hyphens only</div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="su-email" class="input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="su-pass" class="input" placeholder="At least 6 characters">
      </div>
      <div class="agree-row">
        <input type="checkbox" id="agree-terms">
        <label for="agree-terms">I agree to the <a href="terms.html" target="_blank">Terms & Conditions</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></label>
      </div>
      <button class="btn btn-primary btn-full" onclick="signupEmail()" id="btn-signup">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
      <div class="divider" style="margin:18px 0"><span>or</span></div>
      <button class="btn btn-google" onclick="loginGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
        Continue with Google
      </button>
    </div>

    <!-- VERIFY -->
    <div class="form-panel" id="panel-verify">
      <div class="verify-box">
        <div class="verify-icon">📧</div>
        <h3>Check Your Email</h3>
        <p>We sent a verification link to</p>
        <p><span class="verify-email" id="verify-email-addr"></span></p>
        <p style="margin-top:10px;font-size:12px">Click the link in the email, then come back and press the button below.</p>
        <button class="btn btn-primary btn-full" onclick="checkVerified()" style="margin:18px 0 10px">
          <i class="fa-solid fa-rotate-right"></i> I've Verified — Continue
        </button>
        <div><button class="resend-btn" id="resend-btn" onclick="resendVerification()">Resend email</button></div>
        <div style="margin-top:14px">
          <button class="btn btn-outline btn-sm" onclick="auth.signOut();showPanels()">
            <i class="fa-solid fa-arrow-left"></i> Back
          </button>
        </div>
      </div>
    </div>
  </div>

  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('tab')==='signup') switchTab('signup');

function switchTab(t) {
  ['login','signup'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
    document.getElementById('panel-'+x).classList.toggle('active', x===t);
  });
  clearAlert();
}
function showAlert(msg){ const e=document.getElementById('alert'); e.textContent=msg; e.style.display='block'; }
function clearAlert(){ document.getElementById('alert').style.display='none'; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
function setLoading(id, on){
  const b=document.getElementById(id); b.disabled=on;
  const labels={
    'btn-login':'<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In',
    'btn-signup':'<i class="fa-solid fa-user-plus"></i> Create Account'
  };
  b.innerHTML=on?'<div class="spinner"></div>':labels[id];
}

// Username check
let usnTimer;
function checkUsername(val){
  clearTimeout(usnTimer);
  val=val.toLowerCase().replace(/[^a-z0-9\-]/g,'');
  document.getElementById('su-username').value=val;
  const icon=document.getElementById('avail-icon'), msg=document.getElementById('avail-msg');
  if(!val){ icon.textContent=''; msg.textContent='Letters, numbers and hyphens only'; msg.style.color=''; return; }
  if(val.length<3){ icon.textContent='⚠️'; msg.textContent='At least 3 characters'; msg.style.color='#fca5a5'; return; }
  icon.textContent='⏳'; msg.textContent='Checking...'; msg.style.color='';
  usnTimer=setTimeout(async()=>{
    try{
      const s=await db.collection('usernames').doc(val).get();
      if(s.exists){ icon.textContent='❌'; msg.textContent='Already taken'; msg.style.color='#fca5a5'; }
      else{ icon.textContent='✅'; msg.textContent='Available!'; msg.style.color='#86efac'; }
    }catch{ icon.textContent=''; }
  },600);
}

// After auth: save to Firestore
async function afterAuth(user, extra={}){
  try{
    const ref=db.collection('users').doc(user.uid);
    const snap=await ref.get();
    if(!snap.exists){
      let usn=extra.username||(user.email||user.uid).split('@')[0].replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,20)||'user';
      let u=usn, i=1;
      while((await db.collection('usernames').doc(u).get()).exists) u=usn+(i++);
      await db.collection('usernames').doc(u).set({uid:user.uid});
      await ref.set({ uid:user.uid, username:u, name:extra.name||user.displayName||u, bio:'', photo:user.photoURL||'', links:[], createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    }
    window.location.href='dashboard.html';
  }catch(e){
    console.error('afterAuth:',e);
    if(auth.currentUser) window.location.href='dashboard.html';
  }
}

// Login
async function loginEmail(){
  clearAlert();
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){ showAlert('Please fill in all fields'); return; }
  setLoading('btn-login',true);
  try{
    const c=await auth.signInWithEmailAndPassword(email,pass);
    if(!c.user.emailVerified){ setLoading('btn-login',false); showAlert('Please verify your email first — check your inbox'); return; }
    await afterAuth(c.user);
  }catch(e){ setLoading('btn-login',false); showAlert(errMsg(e.code)); }
}

// Signup
async function signupEmail(){
  clearAlert();
  const name=document.getElementById('su-name').value.trim();
  const username=document.getElementById('su-username').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  const agreed=document.getElementById('agree-terms').checked;
  if(!name||!username||!email||!pass){ showAlert('Please fill in all fields'); return; }
  if(!agreed){ showAlert('Please accept the Terms & Conditions'); return; }
  if(username.length<3){ showAlert('Username must be at least 3 characters'); return; }
  if(pass.length<6){ showAlert('Password must be at least 6 characters'); return; }
  setLoading('btn-signup',true);
  try{
    const us=await db.collection('usernames').doc(username).get().catch(()=>({exists:false}));
    if(us.exists){ setLoading('btn-signup',false); showAlert('Username already taken'); return; }
    const c=await auth.createUserWithEmailAndPassword(email,pass);
    await c.user.sendEmailVerification();
    await afterAuth(c.user,{name,username});
    showVerifyPanel(email);
  }catch(e){ setLoading('btn-signup',false); showAlert(errMsg(e.code)); }
}

// Google
async function loginGoogle(){
  clearAlert();
  try{ await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ showAlert(errMsg(e.code)); }
}

// Handle redirect result
auth.getRedirectResult().then(async r=>{ if(r&&r.user) await afterAuth(r.user); }).catch(e=>{ if(e.code) showAlert(errMsg(e.code)); });

// Verify panel
function showVerifyPanel(email){
  document.querySelector('.tabs').style.display='none';
  document.getElementById('alert').style.display='none';
  ['login','signup'].forEach(x=>document.getElementById('panel-'+x).classList.remove('active'));
  document.getElementById('panel-verify').classList.add('active');
  document.getElementById('verify-email-addr').textContent=email;
}
function showPanels(){
  document.querySelector('.tabs').style.display='flex';
  document.getElementById('panel-verify').classList.remove('active');
  switchTab('login');
}
async function checkVerified(){
  const u=auth.currentUser; if(!u){ showPanels(); return; }
  await u.reload();
  if(u.emailVerified) window.location.href='dashboard.html';
  else showToast('⚠️ Not verified yet — check your inbox');
}
async function resendVerification(){
  const u=auth.currentUser; if(!u) return;
  const btn=document.getElementById('resend-btn'); btn.disabled=true;
  try{
    await u.sendEmailVerification();
    showToast('✅ Email sent!');
    let s=60; const t=setInterval(()=>{ btn.textContent=`Wait (${s}s)`; if(--s<0){ clearInterval(t); btn.disabled=false; btn.textContent='Resend email'; } },1000);
  }catch{ btn.disabled=false; showToast('Something went wrong'); }
}

function errMsg(code){
  const m={'auth/user-not-found':'No account found with that email','auth/wrong-password':'Incorrect password','auth/invalid-credential':'Incorrect email or password','auth/email-already-in-use':'Email already in use','auth/invalid-email':'Invalid email address','auth/weak-password':'Password is too weak — use at least 6 characters','auth/network-request-failed':'Network error — check your connection','auth/too-many-requests':'Too many attempts — please wait a moment','auth/operation-not-allowed':'This sign-in method is not enabled'};
  return m[code]||'Something went wrong, please try again';
}

let redirectHandled=false;
auth.onAuthStateChanged(user=>{
  if(user&&user.emailVerified&&!redirectHandled){ redirectHandled=true; setTimeout(()=>{ if(location.pathname.includes('auth.html')) window.location.href='dashboard.html'; },400); }
});
</script>
</body>
</html>
