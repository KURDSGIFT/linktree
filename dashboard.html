<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub — Dashboard</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{padding-bottom:60px}
.page{max-width:680px;margin:0 auto;padding:32px 16px}
.section-head{margin-bottom:18px}
.section-head h2{font-size:17px;font-weight:600}
.section-head p{color:var(--muted);font-size:13px;margin-top:3px}
.mb-section{margin-bottom:32px}
.photo-row{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.photo-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;overflow:hidden;flex-shrink:0;border:2px solid var(--border);cursor:pointer;position:relative}
.photo-circle img{width:100%;height:100%;object-fit:cover}
.photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:50%}
.photo-circle:hover .photo-overlay{opacity:1}
#photo-input{display:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:12px}
.platforms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:18px}
.plat-chip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 6px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;font-size:11px;color:var(--muted)}
.plat-chip i{font-size:18px}
.plat-chip:hover,.plat-chip.selected{border-color:var(--accent);background:rgba(99,102,241,.1);color:var(--text)}
#links-list{display:flex;flex-direction:column;gap:9px}
.link-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px}
.link-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.link-info{flex:1;min-width:0}
.link-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-del{color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .2s;border:none;background:transparent;font-size:13px}
.link-del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--card)}
.share-box{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.share-box a{color:var(--accent2);text-decoration:none;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-box a:hover{text-decoration:underline}
.copy-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;flex-shrink:0}
.copy-btn:hover{color:var(--text)}
.empty-state{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px}
.empty-state i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
.nav-user{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden;cursor:pointer}
.nav-user img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="toast"></div>

<header class="topnav">
  <a href="index.html" class="nav-logo">⚡ LinkHub</a>
  <div style="display:flex;align-items:center;gap:8px">
    <a id="preview-btn" href="#" target="_blank" class="btn btn-outline btn-sm"><i class="fa-solid fa-eye"></i> View Page</a>
    <div class="nav-user" id="nav-avatar"></div>
    <button class="btn btn-outline btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>

<div class="page">

  <!-- Profile -->
  <div class="mb-section">
    <div class="section-head"><h2>Profile</h2><p>Update your display information</p></div>
    <div class="card">
      <div class="photo-row">
        <div class="photo-circle" onclick="document.getElementById('photo-input').click()">
          <div id="photo-display"></div>
          <div class="photo-overlay"><i class="fa-solid fa-camera" style="color:#fff;font-size:18px"></i></div>
        </div>
        <div>
          <div style="font-size:14px;font-weight:500;margin-bottom:3px">Profile Photo</div>
          <div style="font-size:12px;color:var(--muted)">Click to change</div>
        </div>
      </div>
      <input type="file" id="photo-input" accept="image/*" onchange="uploadPhoto(this)">
      <div class="form-row">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="f-name" class="input" placeholder="Alex Johnson">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="f-username" class="input" readonly style="opacity:.6;cursor:not-allowed" title="Username cannot be changed">
        </div>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="f-bio" class="input" rows="2" placeholder="Web Developer · Designer · ..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()" id="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
    </div>
  </div>

  <!-- Links -->
  <div class="mb-section">
    <div class="section-head"><h2>Links</h2><p>Add your social media and websites</p></div>
    <button class="btn btn-primary" onclick="openModal()" style="margin-bottom:14px"><i class="fa-solid fa-plus"></i> Add New Link</button>
    <div id="links-list"></div>
  </div>

  <!-- Share -->
  <div>
    <div class="section-head"><h2>Share Your Page</h2><p>Send this link to anyone</p></div>
    <div class="card">
      <div class="share-box">
        <i class="fa-solid fa-link" style="color:var(--accent2);flex-shrink:0"></i>
        <a id="share-url" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyUrl()"><i class="fa-regular fa-copy"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- Add Link Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add New Link</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>Choose Platform</label>
      <div class="platforms-grid" id="plat-grid"></div>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="m-title" class="input" placeholder="My Website">
    </div>
    <div class="form-group">
      <label>URL</label>
      <input type="url" id="m-url" class="input" placeholder="https://...">
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary" style="flex:1" onclick="addLink()"><i class="fa-solid fa-plus"></i> Add Link</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
const PLATFORMS=[
  {id:'instagram',name:'Instagram',icon:'fa-brands fa-instagram',color:'#e1306c',prefix:'https://instagram.com/'},
  {id:'telegram',name:'Telegram',icon:'fa-brands fa-telegram',color:'#229ed9',prefix:'https://t.me/'},
  {id:'tiktok',name:'TikTok',icon:'fa-brands fa-tiktok',color:'#ff0050',prefix:'https://tiktok.com/@'},
  {id:'youtube',name:'YouTube',icon:'fa-brands fa-youtube',color:'#ff0000',prefix:'https://youtube.com/'},
  {id:'github',name:'GitHub',icon:'fa-brands fa-github',color:'#f0f6fc',prefix:'https://github.com/'},
  {id:'twitter',name:'X / Twitter',icon:'fa-brands fa-x-twitter',color:'#1da1f2',prefix:'https://x.com/'},
  {id:'linkedin',name:'LinkedIn',icon:'fa-brands fa-linkedin',color:'#0a66c2',prefix:'https://linkedin.com/in/'},
  {id:'snapchat',name:'Snapchat',icon:'fa-brands fa-snapchat',color:'#fffc00',prefix:'https://snapchat.com/add/'},
  {id:'facebook',name:'Facebook',icon:'fa-brands fa-facebook',color:'#1877f2',prefix:'https://facebook.com/'},
  {id:'whatsapp',name:'WhatsApp',icon:'fa-brands fa-whatsapp',color:'#25d366',prefix:'https://wa.me/'},
  {id:'website',name:'Website',icon:'fa-solid fa-globe',color:'#818cf8',prefix:'https://'},
];

let userData=null, currentUser=null, selectedPlat=null;

auth.onAuthStateChanged(async user=>{
  if(!user){window.location.href='auth.html';return;}
  if(!user.emailVerified&&user.providerData[0]?.providerId==='password'){
    document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;color:#fff;text-align:center;padding:24px;background:#07070f"><div><div style="font-size:56px;margin-bottom:18px">📧</div><h2 style="font-size:22px;margin-bottom:10px">Email Not Verified</h2><p style="color:#94a3b8;margin-bottom:22px;line-height:1.6">Please check your inbox and click the verification link.</p><button onclick="location.reload()" style="padding:10px 22px;background:#6366f1;border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:14px;font-family:inherit;margin-right:8px">I've Verified</button><button onclick="firebase.auth().signOut().then(()=>location.href='auth.html')" style="padding:10px 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;cursor:pointer;font-size:14px;font-family:inherit">Sign Out</button></div></div>`;
    return;
  }
  currentUser=user;
  try{
    const snap=await db.collection('users').doc(user.uid).get();
    if(!snap.exists){
      setTimeout(async()=>{
        const s2=await db.collection('users').doc(user.uid).get();
        if(!s2.exists){
          const usn=(user.email||user.uid).split('@')[0].replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,20)||'user';
          await db.collection('usernames').doc(usn).set({uid:user.uid}).catch(()=>{});
          await db.collection('users').doc(user.uid).set({uid:user.uid,username:usn,name:user.displayName||usn,bio:'',photo:user.photoURL||'',links:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});
          userData=(await db.collection('users').doc(user.uid).get()).data();
        }else userData=s2.data();
        init();
      },1500);return;
    }
    userData=snap.data(); init();
  }catch(e){
    if(e.code==='permission-denied') showToast('Firestore Rules error — check Firebase Console');
  }
});

function init(){loadProfile();renderLinks();setupShare();buildPlatGrid();}

function loadProfile(){
  document.getElementById('f-name').value=userData.name||'';
  document.getElementById('f-username').value=userData.username||'';
  document.getElementById('f-bio').value=userData.bio||'';
  const d=document.getElementById('photo-display'), nav=document.getElementById('nav-avatar');
  if(userData.photo){
    d.innerHTML=`<img src="${userData.photo}" alt="photo">`;
    nav.innerHTML=`<img src="${userData.photo}" alt="photo">`;
  }else{
    const i=(userData.name||'U').charAt(0).toUpperCase();
    d.innerHTML=i; nav.innerHTML=i;
  }
}

function setupShare(){
  const url=`${location.origin}/profile.html?u=${userData.username}`;
  const el=document.getElementById('share-url'); el.href=url; el.textContent=url.replace('https://','');
  document.getElementById('preview-btn').href=url;
}

async function saveProfile(){
  const name=document.getElementById('f-name').value.trim();
  const bio=document.getElementById('f-bio').value.trim();
  if(!name){showToast('Display name is required');return;}
  const btn=document.getElementById('btn-save'); btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';
  try{
    await db.collection('users').doc(currentUser.uid).update({name,bio});
    userData.name=name; userData.bio=bio; loadProfile(); showToast('✅ Saved!');
  }catch{showToast('Something went wrong');}
  btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i> Save Changes';
}

async function uploadPhoto(input){
  const file=input.files[0]; if(!file) return;
  showToast('⏳ Processing...');
  try{
    const base64=await resizeImage(file,150,150,0.5);
    await db.collection('users').doc(currentUser.uid).update({photo:base64});
    userData.photo=base64; loadProfile(); showToast('✅ Photo updated!');
  }catch{showToast('Upload failed');}
}

function resizeImage(file,mw,mh,q){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=e=>{
      const img=new Image(); img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>mw){h=h*(mw/w);w=mw;}}else{if(h>mh){w=w*(mh/h);h=mh;}}
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      }; img.onerror=rej; img.src=e.target.result;
    }; r.onerror=rej; r.readAsDataURL(file);
  });
}

function renderLinks(){
  const list=document.getElementById('links-list'), links=userData.links||[];
  if(!links.length){list.innerHTML=`<div class="empty-state"><i class="fa-solid fa-link"></i>No links yet — add your first one!</div>`;return;}
  list.innerHTML=links.map((lnk,i)=>{
    const p=PLATFORMS.find(x=>x.id===lnk.platform)||PLATFORMS[10];
    return `<div class="link-item"><div class="link-icon"><i class="${p.icon}" style="color:${p.color}"></i></div><div class="link-info"><div class="link-title">${lnk.title}</div><div class="link-url">${lnk.url}</div></div><button class="link-del" onclick="deleteLink(${i})"><i class="fa-solid fa-trash"></i></button></div>`;
  }).join('');
}

async function addLink(){
  const title=document.getElementById('m-title').value.trim();
  const url=document.getElementById('m-url').value.trim();
  if(!selectedPlat){showToast('Select a platform');return;}
  if(!title){showToast('Enter a title');return;}
  if(!url||!url.startsWith('http')){showToast('Enter a valid URL (https://...)');return;}
  const links=[...(userData.links||[]),{platform:selectedPlat,title,url}];
  await db.collection('users').doc(currentUser.uid).update({links});
  userData.links=links; renderLinks(); closeModal(); showToast('✅ Link added!');
}

async function deleteLink(i){
  if(!confirm('Remove this link?'))return;
  const links=userData.links.filter((_,idx)=>idx!==i);
  await db.collection('users').doc(currentUser.uid).update({links});
  userData.links=links; renderLinks(); showToast('Removed');
}

function buildPlatGrid(){
  document.getElementById('plat-grid').innerHTML=PLATFORMS.map(p=>`<div class="plat-chip" id="chip-${p.id}" onclick="selectPlat('${p.id}')"><i class="${p.icon}" style="color:${p.color}"></i><span>${p.name}</span></div>`).join('');
}

function selectPlat(id){
  document.querySelectorAll('.plat-chip').forEach(c=>c.classList.remove('selected'));
  document.getElementById('chip-'+id).classList.add('selected');
  selectedPlat=id;
  const p=PLATFORMS.find(x=>x.id===id);
  if(!document.getElementById('m-title').value) document.getElementById('m-title').value=p.name;
  if(!document.getElementById('m-url').value) document.getElementById('m-url').value=p.prefix;
}

function openModal(){
  document.getElementById('modal').classList.add('open');
  selectedPlat=null;
  document.getElementById('m-title').value='';
  document.getElementById('m-url').value='';
  document.querySelectorAll('.plat-chip').forEach(c=>c.classList.remove('selected'));
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

function copyUrl(){navigator.clipboard.writeText(document.getElementById('share-url').href).then(()=>showToast('✅ Copied!'));}
async function logout(){await auth.signOut();window.location.href='index.html';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
</body>
</html>
