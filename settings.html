<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub - ڕێکخستنەکان</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>


/* Settings Section */
.settings-section {
  padding: 60px 40px;
  position: relative;
  z-index: 1;
  flex: 1;
}

.settings-header {
  margin-bottom: 48px;
}

.settings-header h1 {
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 700;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #fff 40%, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.settings-header p {
  font-size: 16px;
  color: var(--muted);
  max-width: 600px;
  line-height: 1.6;
}

/* Settings Grid */
.settings-container {
  max-width: 700px;
}

.settings-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  backdrop-filter: blur(10px);
}

.settings-card h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.settings-card i {
  color: var(--accent2);
  font-size: 20px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 8px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
}

.form-group input[type="checkbox"],
.form-group input[type="radio"] {
  width: auto;
  margin-right: 8px;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.checkbox-group label {
  margin: 0;
  cursor: pointer;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.form-actions .btn {
  flex: 1;
}

.divider-line {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

.danger-zone {
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}

.danger-zone h4 {
  color: var(--danger);
  margin-bottom: 12px;
  font-size: 16px;
}

.danger-zone p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 16px;
}

.danger-zone .btn {
  width: 100%;
}

/* Responsive Design */
@media (max-width: 1024px) {
  .sidebar {
    width: 200px;
  }

  .main-content {
    margin-left: 200px;
  }

  .settings-section {
    padding: 40px 24px;
  }
}

@media (max-width: 768px) {
  .settings-section {
    padding: 40px 20px;
  }

  .settings-header h1 {
    font-size: 28px;
  }

  .settings-container {
    max-width: 100%;
  }
}

@media (max-width: 480px) {
  .settings-section {
    padding: 24px 16px;
  }

  .settings-header h1 {
    font-size: 24px;
  }

  .settings-card {
    padding: 16px;
  }

  .form-actions {
    flex-direction: column;
  }
}

.success-message {
  display: none;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
}

.success-message.show {
  display: block;
}
</style>
</head>
<body>



<!-- Main Content -->
<main class="main-content">
  <section class="settings-section">
    <div class="settings-header">
      <h1>ڕێکخستنەکان</h1>
      <p>هەژمارەکەت ڕێکبخە و زانیاریەکانت بگۆڕە</p>
    </div>

    <div class="settings-container">
      <!-- Account Settings -->
      <div class="settings-card">
        <h3><i class="fa-solid fa-user"></i> ڕێکخستنی هەژمار</h3>
        
        <div class="success-message" id="successMessage">
          <i class="fa-solid fa-check"></i> گۆڕانکاریەکان بە سەرکەوتوویی پاشەکەوت کران!
        </div>

        <form id="accountForm">
          <div class="form-group">
            <label>ناو</label>
            <input type="text" placeholder="ناوی تایبەتت" value="بەکارهێنەر" required>
          </div>

          <div class="form-group">
            <label>ئیمێیل</label>
            <input type="email" placeholder="ئیمێیلت" value="user@example.com" required>
          </div>

          <div class="form-group">
            <label>ناوی بەکارهێنەر</label>
            <input type="text" placeholder="ناوی بەکارهێنەرت" value="username" required>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="resetForm('accountForm')">پاشگەز</button>
            <button type="submit" class="btn btn-primary">پاشەکەوت کردن</button>
          </div>
        </form>
      </div>

      <!-- Password Settings -->
      <div class="settings-card">
        <h3><i class="fa-solid fa-lock"></i> گۆڕینی پاسۆرد</h3>

        <form id="passwordForm">
          <div class="form-group">
            <label>پاسۆردی ئێستا</label>
            <input type="password" placeholder="پاسۆردی ئێستات" required>
          </div>

          <div class="form-group">
            <label>پاسۆردی نوێ</label>
            <input type="password" placeholder="پاسۆردی نوێت" required>
          </div>

          <div class="form-group">
            <label>پاسۆردی نوێ (دووبارە)</label>
            <input type="password" placeholder="پاسۆردی نوێت دووبارە" required>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="resetForm('passwordForm')">پاشگەز</button>
            <button type="submit" class="btn btn-primary">پاسۆرد گۆڕین</button>
          </div>
        </form>
      </div>

      <!-- Privacy Settings -->
      <div class="settings-card">
        <h3><i class="fa-solid fa-shield-halved"></i> تایبەتمەندی</h3>

        <div class="checkbox-group">
          <input type="checkbox" id="publicProfile" checked>
          <label for="publicProfile">لاپەڕەکەم گشتی بکە</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="showEmail" checked>
          <label for="showEmail">ئیمێیلم نیشان بدە</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="allowMessages" checked>
          <label for="allowMessages">پەیامی تێدابنێ</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="newsletter" checked>
          <label for="newsletter">نیوزلێتەر وەربگرە</label>
        </div>

        <div class="form-actions" style="margin-top: 20px;">
          <button type="button" class="btn btn-primary" onclick="savePrivacySettings()">پاشەکەوت کردن</button>
        </div>
      </div>

      <!-- Notification Settings -->
      <div class="settings-card">
        <h3><i class="fa-solid fa-bell"></i> ئاگاداریەکان</h3>

        <div class="checkbox-group">
          <input type="checkbox" id="emailNotif" checked>
          <label for="emailNotif">ئاگاداری بە ئیمێیل</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="pushNotif" checked>
          <label for="pushNotif">ئاگاداری Push</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="newsNotif" checked>
          <label for="newsNotif">ئاگاداری هەواڵ</label>
        </div>

        <div class="form-actions" style="margin-top: 20px;">
          <button type="button" class="btn btn-primary" onclick="saveNotificationSettings()">پاشەکەوت کردن</button>
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="settings-card">
        <h3><i class="fa-solid fa-exclamation-triangle"></i> ناوچەی خەتەرناک</h3>

        <div class="danger-zone">
          <h4>سڕینەوەی هەژمار</h4>
          <p>ئەگەر هەژمارەکەت سڕیت، هەموو زانیاریەکانت بە جێهێڵدەرێت. ئەم کردارە نیکراوە!</p>
          <button type="button" class="btn btn-danger" onclick="deleteAccount()">
            <i class="fa-solid fa-trash"></i> سڕینەوەی هەژمار
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/back-button.js"></script>

<script>
// Mobile Menu Toggle
const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const sidebar = document.getElementById('sidebar');

mobileMenuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('active');
});

// Close sidebar when clicking on a link
document.querySelectorAll('.sidebar-nav a').forEach(link => {
  link.addEventListener('click', () => {
    sidebar.classList.remove('active');
  });
});

// Close sidebar when clicking outside
document.addEventListener('click', (e) => {
  if (!sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
    sidebar.classList.remove('active');
  }
});

// Form Functions
function resetForm(formId) {
  document.getElementById(formId).reset();
}

function showSuccessMessage() {
  const msg = document.getElementById('successMessage');
  msg.classList.add('show');
  setTimeout(() => {
    msg.classList.remove('show');
  }, 3000);
}

// Account Form
document.getElementById('accountForm').addEventListener('submit', (e) => {
  e.preventDefault();
  showSuccessMessage();
});

// Password Form
document.getElementById('passwordForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const newPass = e.target[1].value;
  const confirmPass = e.target[2].value;
  
  if (newPass !== confirmPass) {
    alert('پاسۆردەکان یەکسان نین!');
    return;
  }
  
  alert('پاسۆرد بە سەرکەوتوویی گۆڕدرا!');
  resetForm('passwordForm');
});

// Privacy Settings
function savePrivacySettings() {
  alert('ڕێکخستنی تایبەتمەندی پاشەکەوت کران!');
}

// Notification Settings
function saveNotificationSettings() {
  alert('ڕێکخستنی ئاگاداریەکان پاشەکەوت کران!');
}

// Delete Account
function deleteAccount() {
  if (confirm('ئایا دڵنیایت کە دەتەوێت هەژمارەکەت سڕیت؟ ئەم کردارە نیکراوە!')) {
    if (confirm('ئەم کردارە هەمووی سڕیدەکات. دڵنیایت؟')) {
      alert('هەژمارەکەت سڕدرا.');
      // Redirect to home
      window.location.href = 'index.html';
    }
  }
}
</script>
</body>
</html>
